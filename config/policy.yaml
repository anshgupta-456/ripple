# RIPPLE action policy. Safety is code: this file is the only place tiers are defined.
# Tier 1 agent alone | Tier 2 merchant consent | Tier 3 human approval | Tier 4 never (no tool exists)

allowed_docs: [invoice, delivery_proof, customer_comm, bank_statement, courier_receipt]

reads:   # read-only tools, tier 1, no parameters
  - read_settlement
  - read_dispute
  - read_kyc
  - read_supplier_obligation
  - read_refund
  - read_notifications
  - read_ext_state          # merchant profile, re-KYC links, follow-ups, bridge offers, receivables (extensions only)

actions:
  submit_dispute_evidence:
    tier: 3
    max_per_case: 2
    params:
      dispute_id: {type: id}
      docs: {type: doc_list}
  send_supplier_notice:
    tier: 2
    max_per_case: 2
    params:
      text: {type: text, max_len: 600}
  send_merchant_message:
    tier: 1
    max_per_case: 40
    params:
      text: {type: text, max_len: 800}
  send_kyc_reminder:
    tier: 1
    max_per_case: 1
    requires: kyc_opt_in        # merchant must already have opted in
    params: {}

  # ---- v3 Tier 1 'schedule internal recheck'; added after the v1 freeze, only present in worlds with extensions ----
  schedule_follow_up:
    tier: 1
    max_per_case: 2
    params:
      hours: {type: int_range, min: 1, max: 72}
      reason: {type: enum, values: [check_dispute, check_kyc, check_settlement]}

  send_rekyc_link:              # Full Feature Spec feature 7: a re-KYC deep link lives in the app; no URL is ever passed through text
    tier: 1
    max_per_case: 1
    params: {}
  accept_bridge_offer:          # a financial product: only with the merchant's consent, with bounded amount (feature 13)
    tier: 2
    max_per_case: 1
    params:
      kind: {type: enum, values: [instant_settlement, short_term_credit]}
      amount: {type: int_range, min: 1000, max: 200000}
  send_debtor_reminder:         # a message to a third party about money owed to the merchant (feature 19)
    tier: 2
    max_per_case: 3
    params:
      debtor_id: {type: id}
      text: {type: text, max_len: 500}

# Named so denials are explicit and audited. None of these has an executable tool.
forbidden:
  - release_risk_hold
  - release_hold
  - change_bank_details
  - update_bank_account
  - approve_dispute
  - override_risk_decision
  - issue_refund
  - transfer_funds
  - waive_kyc
  - grant_approval
  - fabricate_evidence
