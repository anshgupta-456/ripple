# RIPPLE frozen configuration. SYNTHETIC / MODELED values only.
# Every assumption used by the engine, simulator, benchmark and scoreboard lives here.
# Tag the repo `frozen-v1` before the scored benchmark run; do not edit afterwards.

version: "0.2.0-draft"
synthetic_data_banner: "SYNTHETIC DATA. Modeled assumptions, no real merchants or money."

simulation:
  timezone_offset_minutes: 330        # IST
  default_seed: 5120
  monte_carlo_samples: 2000

benchmark:
  # Families never used for tuning thresholds, prompts or weights.
  # supplier_promise_unsaveable was removed from this list on 2026-10-28: the dev run exposed a harm-model gap on it
  # (fixing the cause had no benefit once the deadline was lost) and the model was changed, so it is no longer clean held-out.
  held_out_families:
    - no_action
    - conflicting_source_states
  base_seed: 7000          # scenario seeds are base_seed + i
  runs_per_family: 12      # 12 families x 12 seeds x 5 systems = 720 runs
  systems: [A, B, C, D, E]

tiers:
  1: "agent_alone"
  2: "merchant_consent"
  3: "human_approval"
  4: "never"

policy:
  approval_expiry_minutes: 60
  min_benefit_threshold: 0.05         # best score at/below this => DO_NOTHING
  decision_stability_min: 0.8
  extraction_confidence_min: 0.7
  max_failed_action_retries: 1

cost_model:                           # MODELED, illustrative only
  manual_minutes_per_case: 14
  manual_minutes_per_escalated_case: 22
  prebuilt_memo_minutes_saved: 9
  cost_per_human_minute_inr: 6.0
  agent_cost_per_case_inr: 0.8

harm_weights:                         # illustrative units of "harm" for a missed obligation
  missed_supplier_payment: 1.0
  missed_refund_sla: 0.6
  kyc_lapse: 0.5
  repeat_contact: 0.1
  settlement_delay_per_day: 0.10     # cost of funds staying stuck, per day, capped by engine.delay_cap_hours

mock_world:
  start_local: "2026-11-02T10:00:00"  # Monday 10:00 IST
  default_review_hours: 20
  default_release_delay_hours: 6

engine:
  # Priors the agent is allowed to know (from "history"). The hidden truth of a scenario is never read.
  review_hours: {mean: 20.0, sd: 4.0, min: 6.0, max: 48.0}
  release_delay_hours: {mean: 6.0, sd: 2.0, min: 2.0, max: 24.0}
  approval_latency_hours: {median: 1.5, sigma: 0.5}
  merchant_self_serve_delay_hours: {mean: 30.0}
  processing_release_jitter_hours: 1.0
  supplier_notice: {accept_prob: 0.6, harm_reduction_if_accepted: 0.7}
  at_risk_p_miss: 0.05
  delay_cap_hours: 168
  unreachable_p_miss: 0.95
  action_costs:                       # normalized, illustrative
    submit_dispute_evidence: 0.02
    send_supplier_notice: 0.01
    send_merchant_message: 0.0
    send_kyc_reminder: 0.005
  risk_penalty_by_tier: {1: 0.0, 2: 0.0, 3: 0.01, 4: 1.0}
  stability_runs: 30
  stability_perturbation: 0.2
