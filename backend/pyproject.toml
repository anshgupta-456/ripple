[project]
name = "ripple-backend"
version = "0.1.0"
description = "RIPPLE: AI customer-service teammate (synthetic hackathon build)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "pyjwt[crypto]>=2.15",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
