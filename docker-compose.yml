# Production-shaped run. With no identity provider configured the API refuses every request, which is the intended default.
# Put your settings in .env (see docs/DEPLOY.md); never commit it. Terminate TLS in a reverse proxy in front of port 8000.
services:
  ripple:
    build:
      context: .
      args:
        EXTRAS: ${RIPPLE_BUILD_EXTRAS:-}        # "aws" to include boto3 for the Secrets Manager adapter
    image: ripple:local
    ports:
      - "127.0.0.1:8000:8000"                   # loopback only; publish through your proxy, not directly
    env_file:
      - path: .env
        required: false
    environment:
      RIPPLE_ENV: ${RIPPLE_ENV:-prod}
      # Language model (all optional; with none the agent uses its deterministic rules). A container cannot reach the host's 127.0.0.1:
      # to use Ollama on the host set RIPPLE_OLLAMA_URL=http://host.docker.internal:11434 and RIPPLE_OLLAMA_ALLOWED_HOSTS=host.docker.internal.
      RIPPLE_LLM_PROVIDER: ${RIPPLE_LLM_PROVIDER:-auto}
      RIPPLE_LOCAL_API: ${RIPPLE_LOCAL_API:-ollama}
      RIPPLE_OLLAMA_URL: ${RIPPLE_OLLAMA_URL:-}
      RIPPLE_OLLAMA_ALLOWED_HOSTS: ${RIPPLE_OLLAMA_ALLOWED_HOSTS:-}
      RIPPLE_OLLAMA_MODEL: ${RIPPLE_OLLAMA_MODEL:-}
    volumes:
      - ripple-data:/var/ripple
    cap_drop: [ALL]                             # a read-only root filesystem is a further hardening step: /app/data needs a writable mount first
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ripple-data:
